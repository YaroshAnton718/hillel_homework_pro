services:

  db:
    image: postgres:18
    container_name: bookstore_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:8-alpine
    container_name: bookstore_redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  web:
    build: .
    image: bookstore-app:latest
    container_name: bookstore_web
    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "8000"

    volumes:
      - static_volume:/app/staticfiles

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  celery:
    image: bookstore-app:latest
    container_name: bookstore_celery
    restart: unless-stopped

    env_file:
      - .env

    entrypoint: ["celery"]
    command:
      - "-A"
      - "bookstore"
      - "worker"
      - "--loglevel=info"

    volumes:
      - reports_volume:/app/reports

    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy


  celery-beat:
    image: bookstore-app:latest
    container_name: bookstore_celery_beat
    restart: unless-stopped

    env_file:
      - .env

    entrypoint: ["celery"]
    command:
      - "-A"
      - "bookstore"
      - "beat"
      - "--loglevel=info"

    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy


  nginx:
    image: nginx:alpine
    container_name: bookstore_nginx
    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - static_volume:/app/staticfiles:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      web:
        condition: service_healthy


volumes:
  postgres_data:
  redis_data:
  static_volume:
  reports_volume: