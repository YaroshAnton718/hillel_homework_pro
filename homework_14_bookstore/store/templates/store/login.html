{% extends 'store/base.html' %}

{% block content %}

<h2>Вхід</h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button
        type="submit"
        class="btn btn-primary"
    >
        Увійти
    </button>
</form>

<p class="mt-3">
    Немає акаунта?
    <a href="{% url 'store:register' %}">
        Зареєструватися
    </a>
</p>

{% endblock %}
