{% extends 'store/base.html' %}
{% load i18n %}

{% block content %}

<h2>{{ book.title }}</h2>

<p>
    <strong>{% translate "Author:" %}</strong>
    {{ book.author }}
</p>

<p>
    <strong>{% translate "Category:" %}</strong>
    {{ book.category }}
</p>

<p>
    <strong>{% translate "Price:" %}</strong>
    {{ book.price }}
</p>

<p>
    <strong>{% translate "Stock:" %}</strong>
    {{ book.stock }}
</p>

{% endblock %}
