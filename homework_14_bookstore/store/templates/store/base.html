{% load static %}

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>BookStore</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'store/css/style.css' %}"
    >
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a
            class="navbar-brand"
            href="{% url 'store:book_list' %}"
        >
            BookStore
        </a>

        <div>
            <a
                href="{% url 'store:cart' %}"
                class="btn btn-outline-light me-2"
            >
                Кошик
            </a>

            {% if user.is_authenticated %}

                <span class="text-white me-3">
                    {{ user.username }}
                </span>

                {% if perms.store.manage_books %}
                    <a
                        class="btn btn-success me-2"
                        href="{% url 'store:book_create' %}"
                    >
                        Додати книгу
                    </a>
                {% endif %}

                <form
                    method="post"
                    action="{% url 'store:logout' %}"
                    class="d-inline"
                >
                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-outline-light"
                    >
                        Вийти
                    </button>
                </form>

            {% else %}

                <a
                    class="btn btn-outline-light me-2"
                    href="{% url 'store:login' %}"
                >
                    Увійти
                </a>

                <a
                    class="btn btn-success"
                    href="{% url 'store:register' %}"
                >
                    Реєстрація
                </a>

            {% endif %}
        </div>

    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
