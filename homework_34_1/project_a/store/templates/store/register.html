{% extends 'store/base.html' %}
{% load i18n %}

{% block content %}

<h2>{% translate "Register" %}</h2>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button
        type="submit"
        class="btn btn-success"
    >
        {% translate "Register" %}
    </button>

</form>

<p class="mt-3">

    {% translate "Already have an account?" %}

    <a href="{% url 'store:login' %}">
        {% translate "Log in" %}
    </a>

</p>

{% endblock %}
