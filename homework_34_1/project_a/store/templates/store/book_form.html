{% extends 'store/base.html' %}
{% load i18n %}

{% block content %}

<h2>{% translate "Book form" %}</h2>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button
        type="submit"
        class="btn btn-success"
    >
        {% translate "Save" %}
    </button>

</form>

{% endblock %}
